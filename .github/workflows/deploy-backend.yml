name: Deploy backend to Azure App Service

# Manual trigger for now - flip to `push: branches: [main]` once you've
# confirmed the first deploy works, so every merge auto-deploys.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # Requires two repo secrets, set under Settings -> Secrets and
      # variables -> Actions (see README.md "Deployment" section):
      #   AZURE_WEBAPP_NAME             - your App Service's name
      #   AZURE_WEBAPP_PUBLISH_PROFILE  - downloaded from the Azure Portal
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:latest
