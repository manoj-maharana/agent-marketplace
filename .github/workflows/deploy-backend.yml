name: Deploy backend to Azure Container Apps

# Manual trigger for now - flip to `push: branches: [main]` once you've
# confirmed the first deploy works, so every merge auto-deploys.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      # Requires three repo secrets, set under Settings -> Secrets and
      # variables -> Actions (see README.md "Deployment" section):
      #   AZURE_CONTAINERAPP_NAME  - your Container App's name
      #   AZURE_RESOURCE_GROUP     - the resource group it's in
      #   AZURE_CREDENTIALS        - resource-group-scoped service principal
      #                              JSON, generated by deploy/azure-provision.ps1
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ secrets.AZURE_CONTAINERAPP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:latest
