services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentmarket
      POSTGRES_PASSWORD: agentmarket
      POSTGRES_DB: agentmarket
    ports:
      - "5432:5432"
    volumes:
      - agentmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentmarket:agentmarket@db:5432/agentmarket
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  agentmarket_pgdata:
